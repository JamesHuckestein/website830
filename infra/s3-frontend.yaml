AWSTemplateFormatVersion: "2010-09-09"
Description: KoC Council 830 — CloudFront distribution with S3 frontend + API Gateway backend

Parameters:
  BucketName:
    Type: String
    Default: koc830-frontend
    Description: Name of the existing S3 bucket hosting the static site
  ApiGatewayUrl:
    Type: String
    Default: ""
    Description: API Gateway endpoint URL (e.g., https://abc123.execute-api.us-east-1.amazonaws.com). Leave empty for frontend-only deployment.

Conditions:
  HasApi: !Not [!Equals [!Ref ApiGatewayUrl, ""]]

Resources:

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${BucketName}-oac"
        Description: OAC for koc830-frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  NoCachingPolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: HasApi
    Properties:
      CachePolicyConfig:
        Name: !Sub "${BucketName}-no-cache-api"
        Comment: No caching for API requests
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all
          EnableAcceptEncodingGzip: false

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Condition: HasApi
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${BucketName}-api-origin-request"
        Comment: Forward all headers and query strings to API
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - Authorization
            - Content-Type
            - Accept
        QueryStringsConfig:
          QueryStringBehavior: all

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: KoC Council 830 frontend + API
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !Sub "${BucketName}.s3.us-east-1.amazonaws.com"
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
          - !If
            - HasApi
            - Id: ApiOrigin
              DomainName: !Select [2, !Split ["/", !Ref ApiGatewayUrl]]
              CustomOriginConfig:
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
            - !Ref "AWS::NoValue"
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors: !If
          - HasApi
          - - PathPattern: /auth/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /members/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /members
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /events/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /events
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /announcements/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /announcements
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /photos/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /photos
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /officers/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /officers
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /prayer-requests/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /prayer-requests
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /meeting-minutes/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /meeting-minutes
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /emails/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /nominations
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /health
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /admin/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: !Ref NoCachingPolicy
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - []
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${BucketName}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  DistributionId:
    Value: !Ref Distribution
    Description: CloudFront distribution ID (use for cache invalidation after deploys)
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
    Description: CloudFront domain name (e.g., d1234abcdef.cloudfront.net)
  FrontendUrl:
    Value: !Sub "https://${Distribution.DomainName}"
    Description: Public URL for the frontend
